[package]
name = "claude-envguard"
version = "2.0.0"
description = "Claude 环境卫士 (EnvGuard) — 启动门禁与运行期进程急停控制台"
license = "AGPL-3.0-only"
authors = ["EnvGuard"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
